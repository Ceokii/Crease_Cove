<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
    <style>
      .zone{fill:#f5f7fa;stroke:#90a4ae;stroke-width:1.5}
      .zt{font-weight:bold;font-size:14px;fill:#263238}
      .box{fill:#ffffff;stroke:#546e7a;stroke-width:1.2}
      .boxa{fill:#e3f2fd;stroke:#1e88e5;stroke-width:1.2}
      .boxg{fill:#e8f5e9;stroke:#43a047;stroke-width:1.2}
      .boxo{fill:#fff3e0;stroke:#fb8c00;stroke-width:1.2}
      .t{fill:#263238}
      .s{fill:#546e7a;font-size:11.5px}
      .ln{stroke:#37474f;stroke-width:1.4;fill:none;marker-end:url(#ar)}
      .lab{fill:#37474f;font-size:11px}
    </style>
  </defs>
  <text x="500" y="26" text-anchor="middle" font-size="17" font-weight="bold" class="t">Crease Cove — схема работы локального прототипа (этап 1)</text>

  <!-- Zone 1 -->
  <rect class="zone" x="20" y="48" width="290" height="380" rx="10"/>
  <text class="zt" x="34" y="72">1. Тестовые данные</text>
  <rect class="boxo" x="36" y="86" width="258" height="84" rx="6"/>
  <text class="t" x="48" y="107">Тестовые манифесты (JSON)</text>
  <text class="s" x="48" y="125">site/src/content/assets/*.json</text>
  <text class="s" x="48" y="142">isTest: true, правятся вручную</text>
  <text class="s" x="48" y="159">хранятся в Git</text>
  <rect class="boxa" x="36" y="200" width="258" height="84" rx="6"/>
  <text class="t" x="48" y="221">Генератор тестовых файлов</text>
  <text class="s" x="48" y="239">npm run test-data</text>
  <text class="s" x="48" y="256">glTF-Transform — GLB с вариантами</text>
  <text class="s" x="48" y="273">fflate — ZIP-пакеты</text>
  <rect class="boxg" x="36" y="314" width="258" height="98" rx="6"/>
  <text class="t" x="48" y="335">Сгенерированные файлы</text>
  <text class="s" x="48" y="353">site/public/test-assets/&lt;slug&gt;/</text>
  <text class="s" x="48" y="370">*.glb · *.zip · *.svg (превью)</text>
  <text class="s" x="48" y="387">помечены «TEST», не в Git,</text>
  <text class="s" x="48" y="404">пересоздаются командой</text>
  <path class="ln" d="M165,170 L165,198"/>
  <path class="ln" d="M165,284 L165,312"/>

  <!-- Zone 2 -->
  <rect class="zone" x="345" y="48" width="300" height="380" rx="10"/>
  <text class="zt" x="359" y="72">2. Сборка: npm run build</text>
  <rect class="boxa" x="361" y="86" width="268" height="66" rx="6"/>
  <text class="t" x="373" y="107">Проверка данных</text>
  <text class="s" x="373" y="125">схема Astro (zod) + проверка файлов;</text>
  <text class="s" x="373" y="142">ошибка — сборка останавливается</text>
  <rect class="boxa" x="361" y="176" width="268" height="66" rx="6"/>
  <text class="t" x="373" y="197">Astro: статические страницы</text>
  <text class="s" x="373" y="215">главная, каталог, категории,</text>
  <text class="s" x="373" y="232">страницы ассетов, служебные</text>
  <rect class="boxa" x="361" y="266" width="268" height="50" rx="6"/>
  <text class="t" x="373" y="287">Pagefind: поисковый индекс</text>
  <text class="s" x="373" y="305">по готовым HTML-страницам</text>
  <rect class="boxg" x="361" y="340" width="268" height="72" rx="6"/>
  <text class="t" x="373" y="361">Результат: папка site/dist/</text>
  <text class="s" x="373" y="379">HTML, CSS, JS, индекс поиска,</text>
  <text class="s" x="373" y="396">копии тестовых файлов</text>
  <path class="ln" d="M495,152 L495,174"/>
  <path class="ln" d="M495,242 L495,264"/>
  <path class="ln" d="M495,316 L495,338"/>
  <path class="ln" d="M294,128 L359,119"/>
  <path class="ln" d="M294,363 C325,363 330,385 359,380"/>

  <!-- Zone 3 -->
  <rect class="zone" x="680" y="48" width="300" height="380" rx="10"/>
  <text class="zt" x="694" y="72">3. Просмотр на компьютере</text>
  <rect class="boxo" x="696" y="86" width="268" height="84" rx="6"/>
  <text class="t" x="708" y="107">npm run preview</text>
  <text class="s" x="708" y="125">локальный сервер Astro</text>
  <text class="s" x="708" y="142">http://localhost:4321</text>
  <text class="s" x="708" y="159">доступен только этому компьютеру</text>
  <rect class="box" x="696" y="194" width="268" height="138" rx="6"/>
  <text class="t" x="708" y="215">Браузер владельца</text>
  <text class="s" x="708" y="235">• каталог, категории, «новые»</text>
  <text class="s" x="708" y="253">• поиск и фильтры (Pagefind)</text>
  <text class="s" x="708" y="271">• 3D-превью и варианты</text>
  <text class="s" x="720" y="288">(model-viewer)</text>
  <text class="s" x="708" y="306">• скачивание тестовых ZIP</text>
  <text class="s" x="708" y="324">• баннер «Тестовые данные»</text>
  <rect class="box" x="696" y="356" width="268" height="56" rx="6"/>
  <text class="t" x="708" y="377">Режим разработки: npm run dev</text>
  <text class="s" x="708" y="395">мгновенное обновление, без поиска</text>
  <path class="ln" d="M629,376 C660,376 660,128 694,128"/>
  <path class="ln" d="M830,170 L830,192"/>

  <!-- Checks -->
  <rect class="zone" x="20" y="452" width="960" height="118" rx="10"/>
  <text class="zt" x="34" y="476">4. Автоматические проверки: npm run check-all (запускаются перед каждой передачей работы владельцу)</text>
  <rect class="box" x="36" y="490" width="170" height="64" rx="6"/>
  <text class="t" x="48" y="512">astro check</text>
  <text class="s" x="48" y="530">типы TypeScript</text>
  <text class="s" x="48" y="546">и шаблоны</text>
  <rect class="box" x="224" y="490" width="170" height="64" rx="6"/>
  <text class="t" x="236" y="512">Проверка данных</text>
  <text class="s" x="236" y="530">схема, файлы,</text>
  <text class="s" x="236" y="546">isTest, уникальность</text>
  <rect class="box" x="412" y="490" width="170" height="64" rx="6"/>
  <text class="t" x="424" y="512">Сборка</text>
  <text class="s" x="424" y="530">astro build</text>
  <text class="s" x="424" y="546">+ pagefind</text>
  <rect class="box" x="600" y="490" width="170" height="64" rx="6"/>
  <text class="t" x="612" y="512">linkinator</text>
  <text class="s" x="612" y="530">битые ссылки</text>
  <text class="s" x="612" y="546">в site/dist/</text>
  <rect class="box" x="788" y="490" width="176" height="64" rx="6"/>
  <text class="t" x="800" y="512">Playwright</text>
  <text class="s" x="800" y="530">сценарии в браузере</text>
  <text class="s" x="800" y="546">Chromium</text>

  <text class="s" x="20" y="598">Нет облака, нет оплаты, нет публичного адреса. Все данные и файлы — синтетические тестовые, помечены «ТЕСТ» / «TEST».</text>
  <text class="s" x="20" y="616">Код и тестовые манифесты хранятся в GitHub-репозитории; сгенерированные файлы и site/dist/ в Git не попадают.</text>
</svg>
