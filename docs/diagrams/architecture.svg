<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
    <style>
      .zone{fill:#f5f7fa;stroke:#90a4ae;stroke-width:1.5;rx:10}
      .zt{font-weight:bold;font-size:14px;fill:#263238}
      .box{fill:#ffffff;stroke:#546e7a;stroke-width:1.2;rx:6}
      .boxa{fill:#e3f2fd;stroke:#1e88e5;stroke-width:1.2;rx:6}
      .boxg{fill:#e8f5e9;stroke:#43a047;stroke-width:1.2;rx:6}
      .boxo{fill:#fff3e0;stroke:#fb8c00;stroke-width:1.2;rx:6}
      .boxd{fill:#fafafa;stroke:#9e9e9e;stroke-width:1.2;stroke-dasharray:5 4;rx:6}
      .t{fill:#263238}
      .s{fill:#546e7a;font-size:11.5px}
      .ln{stroke:#37474f;stroke-width:1.4;fill:none;marker-end:url(#ar)}
      .lnd{stroke:#37474f;stroke-width:1.2;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}
      .lab{fill:#37474f;font-size:11px}
    </style>
  </defs>
  <text x="500" y="26" text-anchor="middle" font-size="17" font-weight="bold" class="t">Crease Cove — возможная архитектура публичной версии (не утверждена)</text>

  <!-- Owner workstation -->
  <rect class="zone" x="20" y="48" width="300" height="420"/>
  <text class="zt" x="34" y="72">Компьютер владельца</text>
  <rect class="box" x="38" y="86" width="264" height="52"/>
  <text class="t" x="50" y="107">Blender (ручное моделирование,</text>
  <text class="t" x="50" y="125">UV, материалы, варианты)</text>
  <rect class="boxo" x="38" y="152" width="264" height="52"/>
  <text class="t" x="50" y="173">Claude Code: помощь в сценах,</text>
  <text class="t" x="50" y="191">скриптах и документации</text>
  <rect class="boxa" x="38" y="218" width="264" height="70"/>
  <text class="t" x="50" y="239">Python-скрипты Blender (фон):</text>
  <text class="s" x="50" y="257">проверка → запекание → экспорт</text>
  <text class="s" x="50" y="274">→ упаковка ZIP → manifest.json</text>
  <rect class="box" x="38" y="302" width="264" height="52"/>
  <text class="t" x="50" y="323">Ручная проверка: импорт в</text>
  <text class="t" x="50" y="341">Blender / движки, рендеры превью</text>
  <rect class="boxg" x="38" y="368" width="264" height="44"/>
  <text class="t" x="50" y="395">Мастер-архив исходников (.blend)</text>
  <text class="s" x="38" y="452">Здесь же: секреты для загрузки (не в Git)</text>

  <!-- GitHub -->
  <rect class="zone" x="350" y="48" width="290" height="190"/>
  <text class="zt" x="364" y="72">GitHub</text>
  <rect class="box" x="366" y="86" width="258" height="58"/>
  <text class="t" x="378" y="108">Репозиторий: код сайта,</text>
  <text class="t" x="378" y="126">документация, манифесты ассетов</text>
  <rect class="box" x="366" y="160" width="258" height="58"/>
  <text class="t" x="378" y="182">CI: проверка манифестов,</text>
  <text class="t" x="378" y="200">сборка и выкладка сайта</text>

  <!-- Cloudflare -->
  <rect class="zone" x="350" y="262" width="290" height="300"/>
  <text class="zt" x="364" y="286">Cloudflare</text>
  <rect class="boxa" x="366" y="298" width="258" height="58"/>
  <text class="t" x="378" y="320">Workers + Static Assets:</text>
  <text class="s" x="378" y="338">статические страницы каталога</text>
  <rect class="boxa" x="366" y="366" width="258" height="44"/>
  <text class="t" x="378" y="393">Worker /download: учёт, лимиты</text>
  <rect class="boxg" x="366" y="420" width="258" height="58"/>
  <text class="t" x="378" y="442">R2: ZIP-пакеты, GLB, превью</text>
  <text class="s" x="378" y="460">свой домен + кэш CDN</text>
  <rect class="boxd" x="366" y="488" width="122" height="58"/>
  <text class="t" x="374" y="510">D1</text>
  <text class="s" x="374" y="528">индекс (позже)</text>
  <rect class="boxd" x="498" y="488" width="126" height="58"/>
  <text class="t" x="506" y="510">WAF / Access</text>
  <text class="s" x="506" y="528">лимиты, админка</text>

  <!-- Browser -->
  <rect class="zone" x="670" y="262" width="310" height="256"/>
  <text class="zt" x="684" y="286">Браузер пользователя</text>
  <rect class="box" x="686" y="298" width="278" height="44"/>
  <text class="t" x="698" y="325">Каталог, категории, страницы</text>
  <rect class="box" x="686" y="352" width="278" height="44"/>
  <text class="t" x="698" y="379">Поиск и фильтры (Pagefind)</text>
  <rect class="box" x="686" y="406" width="278" height="44"/>
  <text class="t" x="698" y="433">3D-превью GLB (model-viewer)</text>
  
  <!-- Backup / monitoring -->
  <rect class="zone" x="670" y="48" width="310" height="190"/>
  <text class="zt" x="684" y="72">Резерв и наблюдение</text>
  <rect class="boxg" x="686" y="86" width="278" height="58"/>
  <text class="t" x="698" y="108">Резервная копия у другого</text>
  <text class="s" x="698" y="126">поставщика + внешний диск</text>
  <rect class="box" x="686" y="160" width="278" height="58"/>
  <text class="t" x="698" y="182">Аналитика Cloudflare, журнал</text>
  <text class="s" x="698" y="200">ошибок, оповещения о квотах</text>

  <!-- Arrows -->
  <path class="ln" d="M170,138 L170,152"/>
  <path class="ln" d="M170,204 L170,218"/>
  <path class="ln" d="M170,288 L170,302"/>
  <path class="ln" d="M170,354 L170,368"/>
  <path class="ln" d="M302,240 L326,240 L326,115 L366,115"/>
  <path class="ln" d="M302,270 L340,270 L340,449 L366,449"/>
  <path class="ln" d="M495,144 L495,160"/>
  <path class="ln" d="M495,218 L495,298"/>
  <path class="ln" d="M686,320 L624,322"/>
  <path class="ln" d="M686,482 L648,482 L648,388 L624,388"/>
  <path class="ln" d="M686,428 L624,452"/>
  <path class="ln" d="M495,410 L495,420"/>
  <path class="lnd" d="M170,412 L170,600 L990,600 L990,115 L964,115"/>
  <path class="lnd" d="M624,304 L656,304 L656,189 L686,189"/>
  <g font-size="11" font-weight="bold" fill="#ffffff">
    <circle cx="326" cy="178" r="9" fill="#37474f"/><text x="322.5" y="182">1</text>
    <circle cx="340" cy="360" r="9" fill="#37474f"/><text x="336.5" y="364">2</text>
    <circle cx="495" cy="258" r="9" fill="#37474f"/><text x="491.5" y="262">3</text>
    <circle cx="655" cy="321" r="9" fill="#37474f"/><text x="651.5" y="325">4</text>
    <circle cx="648" cy="440" r="9" fill="#37474f"/><text x="644.5" y="444">5</text>
    <circle cx="580" cy="600" r="9" fill="#37474f"/><text x="576.5" y="604">6</text>
  </g>
  <rect class="box" x="686" y="460" width="278" height="44"/>
  <text class="t" x="698" y="487">Скачивание выбранного пакета</text>
  <text class="s" x="20" y="630">1 — манифест ассета попадает в Git (через Pull Request); 2 — скрипт загружает пакеты, GLB и превью в R2; 3 — CI собирает и выкладывает сайт;</text>
  <text class="s" x="20" y="648">4 — браузер получает страницы; 5 — скачивание идёт через Worker (учёт, лимиты), 3D-превью и картинки — напрямую из R2 через CDN; 6 — резерв.</text>
  <text class="s" x="20" y="666">Схема относится к возможной публичной версии (этап 4). Пунктир — компоненты, добавляемые только по мере роста.</text>
  <text class="s" x="20" y="684">Локальный прототип (этап 1) не использует облако: только Astro, Pagefind и тестовые файлы на компьютере.</text>
</svg>
